name: Scrape Paddy Power odds

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Connect to Surfshark VPN
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          echo "${{ secrets.SURFSHARK_WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo sed -i '/^DNS/d' /etc/wireguard/wg0.conf
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          echo "--- country check ---"
          curl -s https://ipinfo.io/country
      - run: node scripts/scrapePaddyPower.mjs
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Disconnect VPN
        if: always()
        run: sudo wg-quick down wg0 || true
